<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TestClub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Study notes with slide references, spaced-review practice and mock exams for the Winter 2026/27 lecture courses. Unofficial, free, no accounts." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('testclub.prefs') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <tc-root></tc-root>
    <noscript>TestClub needs JavaScript to run the practice tools.</noscript>
  </body>
</html>
